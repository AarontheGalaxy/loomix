[workspace]
resolver = "2"
members = [
    "crates/loomix-core",
    "crates/loomix-hal",
    "crates/loomix-net",
    "crates/loomix-rpc",
    "crates/loomix-recorder",
    "crates/loomix-config",
    "crates/loomix-cli",
    "crates/loomix-app",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loomix/loomix"
